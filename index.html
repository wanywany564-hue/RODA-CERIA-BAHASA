<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roda Cabaran Kantin Sihat - BM Tahun 4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { 
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden !important; 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #d97706 100%);
            user-select: none;
        }
        .font-game { font-family: 'Fredoka One', cursive; }
        .spin-wheel { transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1); }
        .btn-game { 
            box-shadow: 0 4px 0 rgba(0,0,0,0.25); 
            transition: all 0.1s ease-in-out; 
        }
        .btn-game:active { 
            transform: translateY(3px); 
            box-shadow: 0 1px 0 rgba(0,0,0,0.25); 
        }
        .bg-pop {
            background-color: #2563eb;
            background-image: radial-gradient(#60a5fa 3px, transparent 3px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-pop flex items-center justify-center p-2 sm:p-3">

    <audio id="sfx-cheer" src="cheer.mp3"></audio>
    <audio id="sfx-wheel" src="wheel_spin.mp3"></audio>

    <!-- BINGKAI UTAMA LANDSCAPE -->
    <div class="w-full h-full max-w-[1280px] max-h-[720px] bg-amber-400 rounded-3xl border-8 border-yellow-300 shadow-2xl flex flex-col justify-between overflow-hidden p-2 sm:p-3 relative">
        
        <!-- HEADER -->
        <header class="bg-gradient-to-r from-red-500 via-amber-500 to-emerald-500 p-2 rounded-2xl border-4 border-white shadow-md flex justify-between items-center text-white shrink-0">
            <div class="flex items-center space-x-2">
                <span class="text-2xl sm:text-3xl filter drop-shadow">🎡</span>
                <div>
                    <h1 class="font-game text-base sm:text-xl text-yellow-200 tracking-wide drop-shadow-[0_2px_0_rgba(0,0,0,0.4)]">RODA CABARAN KANTIN SIHAT</h1>
                    <p class="text-[9px] sm:text-xs text-white font-black opacity-90">BM Tahun 4 • Kemahiran Mendengar & Bertutur</p>
                </div>
            </div>
            <div class="bg-blue-950/80 px-3 py-1.5 rounded-xl border-2 border-yellow-300 shadow-inner text-right">
                <span class="text-[10px] font-black text-yellow-300 block">CABARAN SELESAI</span>
                <span id="score-text" class="font-game text-sm sm:text-base text-white">0 / 5</span>
            </div>
        </header>

        <!-- PAPARAN UTAMA (RODA & KARTU CABARAN) -->
        <main id="app-content" class="flex-1 my-2 bg-gradient-to-b from-sky-400 to-blue-600 rounded-2xl border-4 border-white p-2 sm:p-3 flex items-center justify-center relative overflow-hidden shadow-inner">
            
            <!-- PAPARAN RODA (DEFAULT) -->
            <div id="wheel-screen" class="w-full h-full flex flex-col justify-between items-center py-2">
                <div class="bg-yellow-300 border-2 border-white text-blue-950 px-4 py-1 rounded-full text-xs font-black shadow">
                    🎲 Putar roda untuk mendapatkan tugasan lisan!
                </div>

                <!-- RODA CABARAN BERWARNA-WARNI -->
                <div class="relative w-44 h-44 sm:w-56 sm:h-56 my-auto flex items-center justify-center">
                    <div id="wheel" class="spin-wheel w-full h-full rounded-full border-8 border-yellow-300 bg-gradient-to-tr from-red-500 via-yellow-400 via-green-500 via-blue-500 to-purple-600 shadow-2xl flex items-center justify-center relative overflow-hidden">
                        <!-- ICON RODA -->
                        <div class="w-12 h-12 bg-white rounded-full border-4 border-yellow-400 flex items-center justify-center font-game text-blue-900 text-xl z-10 shadow">
                            🎯
                        </div>
                    </div>
                    <!-- PENUNJUK ATAS -->
                    <div class="absolute -top-3 text-3xl z-20 filter drop-shadow">👇</div>
                </div>

                <button onclick="spinWheel()" class="bg-yellow-400 hover:bg-yellow-300 text-blue-950 font-game py-2 px-8 rounded-2xl text-base sm:text-lg btn-game border-2 border-white shadow-lg">
                    🎲 PUTAR RODA!
                </button>
            </div>

            <!-- PAPARAN SOALAN CABARAN (Akan dimasukkan oleh JS) -->
            <div id="challenge-screen" class="hidden w-full h-full flex-col justify-between items-center text-center">
                <!-- Kandungan Soalan Dimuatkan Melalui JS -->
            </div>

        </main>

        <!-- FOOTER -->
        <footer class="bg-amber-300 p-1.5 rounded-2xl border-4 border-white flex justify-between items-center shrink-0">
            <button onclick="resetGame()" class="bg-red-500 hover:bg-red-600 text-white font-game py-1 px-3 rounded-xl text-xs sm:text-sm btn-game border-2 border-white">
                🔄 Mula Semula
            </button>
            <div class="text-[11px] text-blue-950 font-black tracking-wide hidden sm:block">
                Aktiviti Bertutur & Respon Bertatasusila
            </div>
            <button onclick="alert('Petunjuk:\n1. Putar Roda Cabaran.\n2. Baca situasi dan jawab soalan lisan bersama rakan/guru.\n3. Tekan Selesai untuk mengumpul mata!')" class="bg-blue-600 hover:bg-blue-700 text-white font-game py-1 px-3 rounded-xl text-xs sm:text-sm btn-game border-2 border-white">
                💡 Panduan
            </button>
        </footer>
    </div>

    <script>
        // BANK SOALAN BERDASARKAN STANDARD PEMBELAJARAN TAHUN 4
        const challenges = [
            {
                id: 1,
                title: "AMALAN MEMBASUH TANGAN",
                sp: "SP 1.1.1 - Memahami & Merespons Ujaran",
                img: "premis_singki.png",
                q1: "Mengapakah kita perlu mencuci tangan dengan sabun sebelum makan di kantin?",
                q2: "Nyatakan 2 langkah mencuci tangan yang betul secara bersopan.",
                answer: "Mencuci tangan membunuh kuman dan mengelakkan penyakit keracunan makanan."
            },
            {
                id: 2,
                title: "SITUASI MAKANAN TERDEDAH",
                sp: "SP 1.2.1 - Bertutur Menjelaskan Perkara",
                img: "premis_makanan.png",
                q1: "Apakah risiko jika makanan di kantin dibiarkan terdedah tanpa penutup?",
                q2: "Bina ayat teguran yang sopan kepada peniaga kantin untuk menutup makanan tersebut.",
                answer: "Lalat akan hinggap dan membawa bakteria. 'Mak Cik, mohon tutup makanan ini agar sentiasa bersih.'"
            },
            {
                id: 3,
                title: "ISU SAMPAH BERSEPAH",
                sp: "SP 1.3.1 - Menganalisis & Penambahbaikan",
                img: "premis_sampah.png",
                q1: "Apakah kesan jika sisa makanan dan pembungkus plastik dibiarkan bersepah di meja kantin?",
                q2: "Berikan cadangan penambahbaikan agar murid tidak membuang sampah merata-rata.",
                answer: "Kantin akan berbau busuk. Cadangan: Sediakan lebih banyak tong sampah kitar semula."
            },
            {
                id: 4,
                title: "ETIKA MENYEKAP/BERATUR",
                sp: "SP 1.2.1 - Bertutur Mengikut Konteks",
                img: "soalan1.png",
                q1: "Mengapakah murid perlu beratur dengan tertib semasa membeli makanan di kantin?",
                q2: "Nasihati rakan anda yang cuba memotong barisan secara berhemah.",
                answer: "Memastikan keadaan teratur dan adil. 'Mari kita beratur bersama-sama demi keselamatan.'"
            },
            {
                id: 5,
                title: "SIMULASI PENGAWAS KANTIN",
                sp: "SP 1.1.1 & 1.2.1 - Simulasi Lisan",
                img: "misi3_situasi.png",
                q1: "Lakokan watak Pengawas Kantin yang memberikan arahan pembersihan meja selepas makan.",
                q2: "Gunakan sebutan yang jelas dan intonasi yang bersopan santun.",
                answer: "'Rakan-rakan, sila pastikan meja anda bersih dan angkat pinggan ke dalam besen yang disediakan.'"
            }
        ];

        let completedCount = 0;

        function playSfx(id) {
            const el = document.getElementById(id);
            if(el) { el.currentTime = 0; el.play().catch(()=>{}); }
        }

        function spinWheel() {
            playSfx('sfx-wheel');
            const wheel = document.getElementById('wheel');
            const randomDeg = Math.floor(2000 + Math.random() * 2000);
            wheel.style.transform = `rotate(${randomDeg}deg)`;

            setTimeout(() => {
                const randomItem = challenges[Math.floor(Math.random() * challenges.length)];
                showChallenge(randomItem);
            }, 4200);
        }

        function showChallenge(item) {
            document.getElementById('wheel-screen').classList.add('hidden');
            const screen = document.getElementById('challenge-screen');
            screen.classList.remove('hidden');
            screen.classList.add('flex');

            screen.innerHTML = `
                <div class="w-full h-full bg-white/95 rounded-2xl border-4 border-amber-400 p-2 sm:p-3 shadow-2xl flex flex-col justify-between items-center text-center">
                    
                    <!-- HEADER SOALAN -->
                    <div class="flex items-center justify-between border-b-2 border-slate-200 pb-1 w-full px-2">
                        <span class="bg-purple-600 text-white text-[10px] sm:text-xs px-2 py-0.5 rounded-md font-bold">${item.sp}</span>
                        <h3 class="font-game text-sm sm:text-base text-red-600">🎯 ${item.title}</h3>
                    </div>
                    
                    <!-- KANDUNGAN SOALAN & GAMBAR -->
                    <div class="grid grid-cols-12 gap-3 w-full my-auto items-center">
                        <div class="col-span-4 flex flex-col items-center justify-center">
                            <div class="w-24 h-24 sm:w-32 sm:h-32 bg-amber-100 rounded-2xl border-4 border-yellow-300 overflow-hidden shadow">
                                <img src="${item.img}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150/f59e0b/ffffff?text=Situasi+Kantin'">
                            </div>
                        </div>

                        <div class="col-span-8 bg-blue-50 p-2.5 rounded-xl border-2 border-blue-200 text-left text-xs sm:text-sm font-bold text-slate-800 space-y-2">
                            <div>
                                <span class="text-blue-900 font-black block">❓ Soalan 1 (Menaakul):</span>
                                <p class="text-slate-700">${item.q1}</p>
                            </div>
                            <div>
                                <span class="text-emerald-900 font-black block">🗣️ Soalan 2 (Lisan / Bertutur):</span>
                                <p class="text-slate-700">${item.q2}</p>
                            </div>
                        </div>
                    </div>

                    <!-- BUTANG KAWALAN -->
                    <div class="flex space-x-2 w-full">
                        <button onclick="alert('📌 Cadangan Jawapan Guru:\\n\\n${item.answer}')" class="w-1/2 bg-amber-500 hover:bg-amber-400 text-white font-game py-1.5 rounded-xl text-xs sm:text-sm btn-game border-2 border-white">
                            📋 Cadangan Jawapan
                        </button>
                        <button onclick="completeChallenge()" class="w-1/2 bg-emerald-500 hover:bg-emerald-400 text-white font-game py-1.5 rounded-xl text-xs sm:text-sm btn-game border-2 border-white">
                            Selesai & Tambah Mata 👍
                        </button>
                    </div>
                </div>
            `;
        }

        function completeChallenge() {
            completedCount++;
            document.getElementById('score-text').innerText = completedCount + " / 5";
            playSfx('sfx-cheer');
            confetti({ particleCount: 100, spread: 70 });

            if(completedCount >= 5) {
                showVictory();
            } else {
                backToWheel();
            }
        }

        function backToWheel() {
            const screen = document.getElementById('challenge-screen');
            screen.classList.add('hidden');
            screen.classList.remove('flex');
            document.getElementById('wheel-screen').classList.remove('hidden');
        }

        function showVictory() {
            const screen = document.getElementById('challenge-screen');
            screen.innerHTML = `
                <div class="w-full h-full flex flex-col justify-between items-center text-center p-2">
                    <div class="w-full h-28 sm:h-36 bg-black rounded-xl overflow-hidden border-4 border-yellow-300 shadow-xl flex items-center justify-center">
                        <img src="misi_selesai.gif" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/600x200/10b981/ffffff?text=TAHNIAH!+SEMUA+CABARAN+SELESAI'">
                    </div>

                    <h2 class="font-game text-lg sm:text-2xl text-yellow-300 drop-shadow">TAHNIAH! ANDA WIRA KANTIN SIHAT!</h2>
                    <p class="text-xs text-white font-black opacity-90">Anda telah melengkapkan semua latihan lisan & bertutur dengan cemerlang!</p>

                    <button onclick="resetGame()" class="bg-emerald-500 hover:bg-emerald-400 text-white font-game px-6 py-2 rounded-xl text-xs sm:text-sm btn-game border-2 border-white">
                        🔄 MAIN SEMULA
                    </button>
                </div>
            `;
        }

        function resetGame() {
            completedCount = 0;
            document.getElementById('score-text').innerText = "0 / 5";
            backToWheel();
        }
    </script>
</body>
</html>
